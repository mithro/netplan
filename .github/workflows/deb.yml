name: Debian Package + apt repo

# Build a patched netplan.io (atomic+durable /etc/netplan/*.yaml write) for ALL
# Debian release architectures and publish them as a single signed apt repository
# on GitHub Pages (https://mithro.github.io/netplan/). Mirrors the pattern used
# by other mithro apt-repo projects (e.g. dtbocfg).

on:
  push:
    branches: [welland-atomic-yaml-write]
  workflow_dispatch:

jobs:
  build-deb:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native where possible, QEMU-emulated otherwise. arm64 uses the free
          # arm64 runner (native); everything else builds on the amd64 runner
          # (amd64/i386 native, the rest via QEMU).
          - { arch: amd64,   runner: ubuntu-latest,    platform: linux/amd64 }
          - { arch: i386,    runner: ubuntu-latest,    platform: linux/386 }
          - { arch: arm64,   runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { arch: armhf,   runner: ubuntu-latest,    platform: linux/arm/v7 }
          - { arch: riscv64, runner: ubuntu-latest,    platform: linux/riscv64 }
          - { arch: ppc64el, runner: ubuntu-latest,    platform: linux/ppc64le }
          - { arch: s390x,   runner: ubuntu-latest,    platform: linux/s390x }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for foreign-architecture containers)
        uses: docker/setup-qemu-action@v3

      - name: Build ${{ matrix.arch }} package in debian:trixie
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${PWD}:/src" -w /src \
            docker.io/library/debian:trixie \
            bash packaging/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: built-debs/

  publish-apt:
    needs: build-deb
    # Publish even if some architectures failed to build, as long as at least
    # one produced artifacts.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: apt-repo/

      - name: Generate apt repo metadata
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
          cp packaging/apt-index.html apt-repo/index.html
          cd apt-repo
          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages
          {
            echo "Origin: netplan-welland"
            echo "Label: netplan-welland"
            echo "Suite: stable"
            echo "Codename: trixie"
            echo "Architectures: amd64 arm64 armhf i386 ppc64el riscv64 s390x"
            echo "Components: main"
            echo "Description: Patched netplan.io (atomic+durable /etc/netplan write, no 0-byte files)"
          } > Release
          apt-ftparchive release . >> Release

      - name: Sign repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eux
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd apt-repo
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --armor --clearsign --output InRelease Release
          gpg --batch --yes --armor --export > netplan.gpg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo/

      - id: deploy
        uses: actions/deploy-pages@v4
