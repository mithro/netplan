name: Debian + Raspbian apt repos

# Build the patched netplan.io (atomic+durable /etc/netplan/*.yaml write) and
# publish TWO signed apt repos on one GitHub Pages site:
#   https://mithro.github.io/netplan/debian/    — stock Debian trixie (7 arches)
#   https://mithro.github.io/netplan/raspbian/  — Raspberry Pi OS / Raspbian trixie
#                                                 (armhf=ARMv6 for Pi 1/Zero + arm64)
# RPi OS 64-bit shares Debian's arm64 base, so the arm64 build is reused in both
# repos; the distinct Raspbian build is armhf(ARMv6), which Debian's armhf (ARMv7)
# cannot provide — it is bootstrapped from raspbian.raspberrypi.com via mmdebstrap.

on:
  push:
    branches: [welland-atomic-yaml-write]
  workflow_dispatch:

jobs:
  build-debian:
    name: debian (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64,   runner: ubuntu-latest,    platform: linux/amd64 }
          - { arch: i386,    runner: ubuntu-latest,    platform: linux/386 }
          - { arch: arm64,   runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { arch: armhf,   runner: ubuntu-latest,    platform: linux/arm/v7 }
          - { arch: riscv64, runner: ubuntu-latest,    platform: linux/riscv64 }
          - { arch: ppc64el, runner: ubuntu-latest,    platform: linux/ppc64le }
          - { arch: s390x,   runner: ubuntu-latest,    platform: linux/s390x }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (for foreign-architecture containers)
        uses: docker/setup-qemu-action@v3
      - name: Build ${{ matrix.arch }} package in debian:trixie
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${PWD}:/src" -w /src \
            docker.io/library/debian:trixie \
            bash packaging/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs-debian-${{ matrix.arch }}
          path: built-debs/

  build-raspbian:
    name: raspbian (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Separate from the Debian builds: each is bootstrapped in its own
          # Raspbian/RPi-OS rootfs. armhf=ARMv6 (Pi 1/Zero) is QEMU-emulated on the
          # amd64 runner; arm64 (RPi OS 64-bit) builds natively on the arm64 runner.
          - { arch: armhf, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (binfmt for the foreign-arch chroot)
        uses: docker/setup-qemu-action@v3
      - name: Bootstrap Raspbian ${{ matrix.arch }} rootfs + build
        run: sudo -E env RPI_ARCH=${{ matrix.arch }} bash packaging/ci-build-raspbian.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs-raspbian-${{ matrix.arch }}
          path: built-debs/

  publish:
    needs: [build-debian, build-raspbian]
    # Publish even if a build job failed, as long as at least the Debian arches
    # produced artifacts (the ARMv6 build is the most fragile; don't let it block
    # the rest).
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Assemble + sign the debian and raspbian repos
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          mkdir -p apt-repo/debian apt-repo/raspbian

          # Debian repo: every Debian arch.
          cp dl/debs-debian-*/*.deb apt-repo/debian/

          # Raspbian repo: its OWN arm64 + armhf(ARMv6) builds (kept separate from
          # the Debian arm64 build), whichever succeeded this run.
          for a in arm64 armhf; do
            if compgen -G "dl/debs-raspbian-$a/*.deb" > /dev/null; then
              cp dl/debs-raspbian-$a/*.deb apt-repo/raspbian/
            else
              echo "WARNING: raspbian $a build produced no artifact this run"
            fi
          done

          cp packaging/apt-index.html apt-repo/index.html

          sign_repo() {
            repo="$1"; arches="$2"; desc="$3"
            ( cd "apt-repo/$repo"
              dpkg-scanpackages --multiversion . > Packages
              gzip -k -f Packages
              {
                echo "Origin: netplan-welland"
                echo "Label: netplan-welland-$repo"
                echo "Suite: stable"
                echo "Codename: trixie"
                echo "Architectures: $arches"
                echo "Components: main"
                echo "Description: $desc"
              } > Release
              apt-ftparchive release . >> Release
              gpg --batch --yes --armor --detach-sign --output Release.gpg Release
              gpg --batch --yes --armor --clearsign --output InRelease Release
              gpg --batch --yes --armor --export > netplan.gpg )
          }
          sign_repo debian "amd64 arm64 armhf i386 ppc64el riscv64 s390x" \
            "Patched netplan.io for Debian trixie (atomic+durable /etc/netplan write)"
          sign_repo raspbian "armhf arm64" \
            "Patched netplan.io for Raspberry Pi OS / Raspbian trixie (atomic+durable /etc/netplan write)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo/
      - id: deploy
        uses: actions/deploy-pages@v4
