name: Debian + Raspbian apt repos

# Build the patched netplan.io (atomic+durable /etc/netplan/*.yaml write) and
# publish one signed flat apt repository per suite on one GitHub Pages site,
# through the shared workflow (docs/conventions.md in mithro/apt-repo-action):
#   https://mith.ro/netplan/trixie/           — stock Debian trixie (7 arches)
#   https://mith.ro/netplan/raspbian-trixie/  — Raspberry Pi OS / Raspbian trixie
#                                               (armhf=ARMv6 for Pi 1/Zero + arm64)
# RPi OS 64-bit shares Debian's arm64 base, so the arm64 build is reused in both
# repos; the distinct Raspbian build is armhf(ARMv6), which Debian's armhf (ARMv7)
# cannot provide — it is bootstrapped from raspbian.raspberrypi.com via mmdebstrap.

on:
  push:
    branches: [welland-atomic-yaml-write]
  workflow_dispatch:

jobs:
  build-debian:
    name: debian (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64,   runner: ubuntu-latest,    platform: linux/amd64 }
          - { arch: i386,    runner: ubuntu-latest,    platform: linux/386 }
          - { arch: arm64,   runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { arch: armhf,   runner: ubuntu-latest,    platform: linux/arm/v7 }
          - { arch: riscv64, runner: ubuntu-latest,    platform: linux/riscv64 }
          - { arch: ppc64el, runner: ubuntu-latest,    platform: linux/ppc64le }
          - { arch: s390x,   runner: ubuntu-latest,    platform: linux/s390x }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (for foreign-architecture containers)
        uses: docker/setup-qemu-action@v3
      - name: Build ${{ matrix.arch }} package in debian:trixie
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -e GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            -v "${PWD}:/src" -w /src \
            docker.io/library/debian:trixie \
            bash packaging/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs-trixie-${{ matrix.arch }}
          path: built-debs/

  build-raspbian:
    name: raspbian (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Separate from the Debian builds: each is bootstrapped in its own
          # Raspbian/RPi-OS rootfs. armhf=ARMv6 (Pi 1/Zero) is QEMU-emulated on the
          # amd64 runner; arm64 (RPi OS 64-bit) builds natively on the arm64 runner.
          - { arch: armhf, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (binfmt for the foreign-arch chroot)
        uses: docker/setup-qemu-action@v3
      - name: Bootstrap Raspbian ${{ matrix.arch }} rootfs + build
        run: sudo -E env RPI_ARCH=${{ matrix.arch }} bash packaging/ci-build-raspbian.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs-raspbian-trixie-${{ matrix.arch }}
          path: built-debs/

  publish:
    needs: [build-debian, build-raspbian]
    # Publish even if a build job failed, as long as each suite still has
    # packages (the ARMv6 build is the most fragile; don't let it block the
    # rest). Never from a pull request.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie raspbian-trixie"
      architectures: "amd64 arm64 armhf i386 ppc64el riscv64 s390x"
      description: "Patched netplan.io (atomic+durable /etc/netplan write)"
      # Transitional: the previous debian/ and raspbian/ repositories (Origin
      # netplan-welland), frozen, until every client points at <site>/trixie/
      # or <site>/raspbian-trixie/ and pins o=netplan. The old layout also
      # served the (same) key inside each directory.
      legacy-paths: >-
        debian raspbian
        debian/netplan.gpg=netplan.gpg debian/netplan.asc=netplan.asc
        raspbian/netplan.gpg=netplan.gpg raspbian/netplan.asc=netplan.asc
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
